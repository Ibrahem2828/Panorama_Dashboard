name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Contracts, i18n, security and route checks
        run: |
          npm run contracts:check
          npm run i18n:check
          npm run security:check
          npm run routes:check
      - run: npm run type-check
      - run: npm run lint
      - name: Unit, integration, component and security tests
        run: npm run test:all
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          BACKEND_API_BASE_URL: https://api.example.test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t panorama-dashboard:ci .
      - name: Scan image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.75.0
          image-ref: panorama-dashboard:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
